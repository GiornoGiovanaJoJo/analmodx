
<Directory /var/www/m_trud_ru_usr/data/www/m-trud.ru>
    Options +ExecCGI -Indexes 
    AllowOverride All
    FcgidWrapper "/var/www/m_trud_ru_usr/data/php-bin/m-trud.ru/php"
</Directory>
<VirtualHost 127.0.0.1:81>
    ServerName m-trud.ru
    DocumentRoot "/var/www/m_trud_ru_usr/data/www/m-trud.ru"

    DirectoryIndex index.php index.html
    SuexecUserGroup m_trud_ru_usr m_trud_ru_usr
    CustomLog /var/www/m_trud_ru_usr/data/logs/m-trud.ru-backend.access.log combined
    ErrorLog /var/www/m_trud_ru_usr/data/logs/m-trud.ru-backend.error.log
    ServerAlias m-trud.ru www.m-trud.ru 
    ServerAdmin admin@m-trud.ru

    <FilesMatch "\.ph(p[3-5]?|tml)$">
        SetHandler fcgid-script
    </FilesMatch>

    AddDefaultCharset UTF-8
    SetEnvIf Authorization .+ HTTP_AUTHORIZATION=$0
</VirtualHost>


