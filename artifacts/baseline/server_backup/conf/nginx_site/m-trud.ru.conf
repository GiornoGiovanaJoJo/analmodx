
server {
    server_name m-trud.ru;
    listen 109.172.30.245:443 ssl;
    

    ssl_certificate "/var/www/httpd-cert/m-trud.ru_2025-05-29-19-12_57.crt";
    ssl_certificate_key "/var/www/httpd-cert/m-trud.ru_2025-05-29-19-12_57.key";
    add_header Strict-Transport-Security "max-age=31536000" always;


    http2 on;

    charset utf-8;
    gzip on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/xml application/javascript text/plain application/json image/svg+xml image/x-icon;
    gzip_comp_level 1;

    set $root_path /var/www/m_trud_ru_usr/data/www/m-trud.ru;
    root $root_path;
    disable_symlinks if_not_owner from=$root_path;

    location / {

        proxy_pass http://127.0.0.1:81;
        proxy_redirect http://127.0.0.1:81/ /;
        include /etc/nginx/proxy_params;
    }


     location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|ogg|otf|pdf|tff|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:81;
        proxy_redirect http://127.0.0.1:81/ /;
        include /etc/nginx/proxy_params;
    }

    include "/etc/nginx/fastpanel2-sites/m_trud_ru_usr/m-trud.ru.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/m_trud_ru_usr/data/logs/m-trud.ru-frontend.error.log;
    access_log /var/www/m_trud_ru_usr/data/logs/m-trud.ru-frontend.access.log;
}


server {
    server_name m-trud.ru;

    listen 109.172.30.245:80;
    return 301 https://$host$request_uri;

    error_log /var/www/m_trud_ru_usr/data/logs/m-trud.ru-frontend.error.log;
    access_log /var/www/m_trud_ru_usr/data/logs/m-trud.ru-frontend.access.log;
}


server {
    server_name www.m-trud.ru  ;
    listen 109.172.30.245:80;

    listen 109.172.30.245:443 ssl;
    

    ssl_certificate "/var/www/httpd-cert/m-trud.ru_2025-05-29-19-12_57.crt";
    ssl_certificate_key "/var/www/httpd-cert/m-trud.ru_2025-05-29-19-12_57.key";
    add_header Strict-Transport-Security "max-age=31536000" always;


    http2 on;

    return 301 $scheme://m-trud.ru$request_uri;

    error_log /var/www/m_trud_ru_usr/data/logs/m-trud.ru-frontend.error.log;
    access_log /var/www/m_trud_ru_usr/data/logs/m-trud.ru-frontend.access.log;
}
